<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁開發線上測驗</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --text: #1f2937;
            --muted: #6b7280;
            --correct-bg: #d1fae5;
            --correct-text: #065f46;
            --wrong-bg: #fee2e2;
            --wrong-text: #991b1b;
            --border: #dbe2f0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang TC", sans-serif;
            background: linear-gradient(135deg, #eef2f6 0%, #f4f7fb 100%);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--panel);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--primary-dark);
            margin-top: 0;
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .quiz-box {
            margin-bottom: 24px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: #fafbfc;
            transition: all 0.3s;
        }

        .question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-item label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option-item label:hover {
            border-color: var(--primary);
            background-color: #f0f6ff;
        }

        .option-item input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            flex: 1;
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
        }

        .btn-reset {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-reset:hover {
            background-color: #d1d5db;
        }

        .result-panel {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .correct-answer {
            background-color: var(--correct-bg) !important;
            color: var(--correct-text) !important;
            border-color: #a7f3d0 !important;
        }

        .wrong-answer {
            background-color: var(--wrong-bg) !important;
            color: var(--wrong-text) !important;
            border-color: #fca5a5 !important;
        }

        .status-badge {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>網頁開發線上測驗</h1>
    <p class="subtitle">請回答下列 10 道前端開發基礎問題，完成後點擊「提交答案」。</p>

    <form id="quizForm">
        <div id="quizContainer"></div>

        <div class="btn-container">
            <button type="button" class="btn-submit" onclick="gradeQuiz()">提交答案</button>
            <button type="button" class="btn-reset" onclick="resetQuiz()">重新測驗</button>
        </div>
    </form>

    <div id="result" class="result-panel"></div>
</div>

<script>
    // 轉義特殊符號以正確顯示 HTML 標籤
    function escapeHTML(str) {
        return str.replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;')
                  .replace(/'/g, '&#039;');
    }

    const questions = [
        {
            q: "HTML 的全名是什麼？",
            options: ["HyperText Markup Language", "HighText Machine Language", "Hyper Transfer Markup Language", "Home Tool Markup Language"],
            answer: 0
        },
        {
            q: "CSS 的主要用途是什麼？",
            options: ["設定網頁外觀與排版", "處理資料庫連線", "編譯程式碼", "管理伺服器"],
            answer: 0
        },
        {
            q: "下列哪一個是 JavaScript 的基本資料型別？",
            options: ["Boolean", "ArrayList", "ObjectTag", "Link"],
            answer: 0
        },
        {
            q: "console.log() 在 JavaScript 中主要用來做什麼？",
            options: ["輸出訊息到瀏覽器主控台", "下載資料", "建立網頁圖片", "重設電腦設定"],
            answer: 0
        },
        {
            q: "在 HTML 中，插入圖片應使用哪個標籤？",
            options: ["<image>", "<img>", "<picture>", "<href>"],
            answer: 1
        },
        {
            q: "let 和 const 最主要的差別是什麼？",
            options: ["let 可以重新賦值，const 不行", "let 不能宣告變數", "const 只能用在 CSS", "兩者功能完全相同"],
            answer: 0
        },
        {
            q: "在 CSS 中，哪個屬性可以改變文字顏色？",
            options: ["color", "font-size", "margin", "background"],
            answer: 0
        },
        {
            q: "下列哪一個是正確的 HTML 標題標籤？",
            options: ["<h1>", "<heading>", "<p>", "<title-bold>"],
            answer: 0
        },
        {
            q: "HTML 中用來建立超連結的標籤是？",
            options: ["<a>", "<link>", "<href>", "<connect>"],
            answer: 0
        },
        {
            q: "JavaScript 中用來宣告陣列的符號是？",
            options: ["中括號 [ ]", "大括號 { }", "小括號 ( )", "雙引號 \" \""],
            answer: 0
        }
    ];

    function loadQuiz() {
        const container = document.getElementById('quizContainer');
        container.innerHTML = '';
        questions.forEach((item, index) => {
            let optionsHTML = '';
            item.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li class="option-item">
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}">
                            <span>${escapeHTML(opt)}</span>
                        </label>
                    </li>
                `;
            });

            container.innerHTML += `
                <div class="quiz-box" id="box-${index}">
                    <div class="question">${index + 1}. ${escapeHTML(item.q)}</div>
                    <ul class="options-list">
                        ${optionsHTML}
                    </ul>
                    <div id="feedback-${index}" class="status-badge" style="display:none;"></div>
                </div>
            `;
        });
    }

    function gradeQuiz() {
        let score = 0;
        let unanswered = false;

        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const box = document.getElementById(`box-${index}`);
            const feedback = document.getElementById(`feedback-${index}`);
            
            box.querySelectorAll('label').forEach(lbl => lbl.className = '');
            feedback.style.display = 'none';

            if (!selected) {
                unanswered = true;
                box.style.border = "2px solid #ef4444";
            } else {
                box.style.border = "1px solid var(--border)";
                const userAnswer = parseInt(selected.value);
                
                if (userAnswer === item.answer) {
                    score++;
                    document.getElementById(`label-${index}-${userAnswer}`).classList.add('correct-answer');
                    feedback.innerText = "✓ 正確";
                    feedback.className = "status-badge correct-answer";
                    feedback.style.display = "inline-block";
                } else {
                    document.getElementById(`label-${index}-${userAnswer}`).classList.add('wrong-answer');
                    document.getElementById(`label-${index}-${item.answer}`).classList.add('correct-answer');
                    feedback.innerText = "✗ 錯誤";
                    feedback.className = "status-badge wrong-answer";
                    feedback.style.display = "inline-block";
                }
            }
        });

        if (unanswered) {
            alert("請回答所有題目再提交！紅框代表尚未作答的題目。");
            return;
        }

        const resultPanel = document.getElementById('result');
        resultPanel.style.display = 'block';
        resultPanel.className = `result-panel ${score >= 60 ? 'correct-answer' : 'wrong-answer'}`;
        resultPanel.innerHTML = `測驗結果：${score * 10} 分！ (答對 ${score} / 10 題)`;
        
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function resetQuiz() {
        document.getElementById('quizForm').reset();
        document.getElementById('result').style.display = 'none';
        
        questions.forEach((item, index) => {
            const box = document.getElementById(`box-${index}`);
            box.style.border = "1px solid var(--border)";
            box.querySelectorAll('label').forEach(lbl => lbl.className = '');
            document.getElementById(`feedback-${index}`).style.display = 'none';
        });
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    loadQuiz();
</script>

</body>
</html>
